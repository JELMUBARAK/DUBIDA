<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DUBIDA · Lesson</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body class="bg-[var(--background)] text-[var(--foreground)] antialiased p-0 m-0 min-h-screen">
  <div class="max-w-3xl mx-auto py-3 px-2.5 space-y-3.5">

    <!-- Top bar: back to search, mystery/unit navigation, depth toggle, reset -->
    <div class="flex flex-wrap items-center justify-between gap-2 border-b border-[var(--card-border)] pb-2.5">
      <div class="flex flex-wrap items-center gap-1.5">
        <a href="/" class="px-2.5 py-1 rounded-full text-xs font-bold border border-[var(--card-border)] bg-[var(--card)] hover:border-[var(--foreground)]">DUBIDA</a>
        <div id="navPills" class="flex flex-wrap items-center gap-1.5"></div>
      </div>
      <div class="flex items-center gap-1.5">
        <button onclick="toggleDepth()" id="depthBtn" class="px-2.5 py-1 rounded-full text-xs font-medium border border-[var(--card-border)] bg-[var(--card)] hover:border-[var(--foreground)]"></button>
        <button onclick="resetLesson()" class="text-xs text-[var(--muted-foreground)] hover:text-[var(--foreground)] px-2 py-1">↺ Reset</button>
      </div>
    </div>

    <div id="stage" class="space-y-3.5">
      <p class="text-sm text-[var(--muted-foreground)] text-center py-10">Loading lesson…</p>
    </div>
  </div>

  <script type="module" src="/js/lesson-player.js"></script>
</body>
</html>
